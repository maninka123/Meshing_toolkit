[general]
; Paths resolve relative to this config file.
input_path = ../datasets/captures
; auto selects ONLY the two improved methods below.
; Choices: auto, improved_ball_pivoting, improved_poisson
reconstruction_method = auto
; Empty: <source_folder>/<point_cloud_stem>/meshes/<selected_method>/
output_dir =
extensions = .pcd
recursive = true
skip_existing = true

[adaptive]
max_points = 120000
neighbors = 24
denoise_iterations = 2
voxel_fraction = 0.8
support_multiplier = 2.5
max_depth = 10
threads = 8
