[general]
; Input file or folder. Leave empty to be prompted at runtime.
input_path = C:\Users\Pasindu\OneDrive - UNSW\AMT Project\Software Algorithms\Meshing\Dataset_01
; Default method: ball_pivoting, alpha_shape, poisson
reconstruction_method = ball_pivoting
; Output directory for single-file runs (relative or absolute).
output_dir = meshes
; Extensions to scan in folder mode (comma-separated).
extensions = .pcd
; Search folders recursively (true/false).
recursive = True
; Skip processing if output already exists (true/false).
skip_existing = True

[normals]
enabled = true
k = 30
smooth_iter = 0
flip = false

[ball_pivoting]
radius_auto = true
radius_scale = 2.5
radius = 0.02

[alpha_shape]
alpha = 0.05

[poisson]
depth = 10
cg_depth = 8
iters = 8
scale = 1.1
samples_per_node = 1.5
point_weight = 4.0
confidence = false
pre_clean = false
